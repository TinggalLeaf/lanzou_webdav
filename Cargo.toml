[workspace]
resolver = "2"
members = [".", "crate/lanzou-sdk"]

[package]
name = "lanzou_webdav"
version = "0.1.0"
edition = "2021"
description = "把蓝奏云挂载为 WebDAV 的轻量 Docker 服务"

[[bin]]
name = "lanzou_webdav"
path = "src/main.rs"

[dependencies]
# 蓝奏云 SDK（路径依赖）
lanzou-sdk = { path = "crate/lanzou-sdk" }

# Web 框架
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"

# HTTP 客户端（用于 SDK 之外的请求）
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 配置 / 文件
toml = "0.8"

# 时间
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1"
thiserror = "1"

# Base64
base64 = "0.21"

# URL 解析
url = "2"

# 正则
regex = "1.10"

# 字节类型
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"